[project]
name = "devspacehub"
version = "1.0.0"
description = "DevSpaceHub — интерактивная платформа-портфолио (React + FastAPI)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.142.2",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"
